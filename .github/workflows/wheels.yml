name: Build wheels
on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # os + python cross-product; include adds arch metadata per os
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
          - os: macos-latest
            arch: arm64
          - os: windows-latest
            arch: AMD64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          miniforge-version: latest
          python-version: ${{ matrix.python }}
          conda-remove-defaults: true

      - name: Install wheel repair tool
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            pip install auditwheel patchelf
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            pip install delocate
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            pip install delvewheel
          fi

      - name: Build wheel
        run: pip wheel . --no-build-isolation --no-deps --wheel-dir raw-dist/

      # Repair bundles shared libs (libpinocchio, libboost, etc.) into the wheel
      # so users can pip install without needing conda/pinocchio on their system.

      - name: Repair wheel (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          LD_LIBRARY_PATH="$CONDA_PREFIX/lib" auditwheel repair -w dist/ raw-dist/*.whl

      - name: Repair wheel (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          DYLD_LIBRARY_PATH="$CONDA_PREFIX/lib" delocate-wheel -w dist/ -v raw-dist/*.whl

      - name: Repair wheel (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir -p dist
          python -m delvewheel repair --add-path "$CONDA_PREFIX/Library/bin" -w dist/ raw-dist/*.whl

      - name: Test wheel
        run: |
          pip install dist/*.whl
          pip install pytest
          pytest tests/ -v

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.arch }}-py${{ matrix.python }}
          path: dist/*.whl

  sdist:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build sdist
        run: |
          python -m pip install -U build
          python -m build --sdist

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: sdist
          path: dist/*.tar.gz

      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: dist/*.tar.gz

  upload-release:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
